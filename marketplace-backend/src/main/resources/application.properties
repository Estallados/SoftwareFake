spring.application.name=marketplace

server.port=8081


spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.orm.jdbc.bind=OFF

spring.jwt.secret=${AES_SECRET_KEY}
spring.jwt.expirationtime=3600000

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=marketplacealojamientos@gmail.com
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com

# --- Administrador inicial ---
app.admin.email=${ADMIN_EMAIL:admin@marketplace.local}
app.admin.password=${ADMIN_PASSWORD:Admin#12345}
app.admin.full-name=Administrador

springdoc.swagger-ui.path=/swagger-ui.html



# --- Inicio de sesión con Google: client ID de OAuth (tipo "Aplicación web") del proyecto
# proyecto-software-513202 en Google Cloud. No es secreto: es el mismo que usa el botón del front
# (lo entrega GET /auth/google/configuracion). GOOGLE_CLIENT_ID lo reemplaza; vacío, /auth/google responde 503.
# El client secret NO se usa en este flujo y nunca debe ir aquí ---
app.google.client-id=${GOOGLE_CLIENT_ID:928256385399-h2jla557omaf728jmijqqrul1sbb26td.apps.googleusercontent.com}

# --- Pagos con Stripe en modo prueba: claves sk_test_ / pk_test_ del dashboard de Stripe (modo prueba).
# Sin STRIPE_SECRET_KEY los pagos usan el simulador local con los mismos métodos de prueba ---
app.stripe.secret-key=${STRIPE_SECRET_KEY:}
app.stripe.publishable-key=${STRIPE_PUBLISHABLE_KEY:}

# --- Datos de demostración (DatosDemoInicializador): DEMO_POBLAR=true los carga una sola vez ---
app.demo.poblar=${DEMO_POBLAR:false}

# --- Archivos subidos (imágenes de alojamientos, se guardan en la tabla archivo_imagen) ---
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=8MB
