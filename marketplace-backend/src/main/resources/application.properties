spring.application.name=marketplace
server.port=8080

# --- Base de datos (PostgreSQL) ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/marketplace}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# --- JWT (en produccion definir JWT_SECRET con minimo 32 caracteres) ---
jwt.secret=${JWT_SECRET:dev-only-secret-change-me-minimum-32-characters-long}
jwt.expiration-ms=86400000

# --- Reglas de negocio configurables ---
app.pricing.service-fee-percent=10
app.simulate-email=true
app.cors.allowed-origins=http://localhost:4200,http://localhost:5173,http://localhost:3000

# --- Administrador inicial ---
app.admin.email=${ADMIN_EMAIL:admin@marketplace.local}
app.admin.password=${ADMIN_PASSWORD:Admin#12345}
app.admin.full-name=Administrador

# --- Swagger ---
springdoc.swagger-ui.path=/swagger-ui.html
