spring.application.name=marketplace

server.port=8081


spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.orm.jdbc.bind=OFF

spring.jwt.secret=${AES_SECRET_KEY}
spring.jwt.expirationtime=3600000

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=marketplacealojamientos@gmail.com
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com

# --- Administrador inicial ---
app.admin.email=${ADMIN_EMAIL:admin@marketplace.local}
app.admin.password=${ADMIN_PASSWORD:Admin#12345}
app.admin.full-name=Administrador

springdoc.swagger-ui.path=/swagger-ui.html


