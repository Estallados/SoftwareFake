name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - name: Compilar y ejecutar pruebas
        run: mvn -B verify
      # Cuando configuren SonarCloud, agreguen aqui el paso:
      # mvn -B org.sonarsource.scanner.maven:sonar-maven-plugin:sonar -Dsonar.projectKey=... -Dsonar.organization=...
      # con SONAR_TOKEN como secret del repositorio.
