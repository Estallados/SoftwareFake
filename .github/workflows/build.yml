name: SonarQube
on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
jobs:
  build:
    name: Build and analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      # Compila, ejecuta las pruebas y genera el reporte de cobertura de JaCoCo
      # (marketplace-backend/target/site/jacoco/jacoco.xml). Las pruebas usan H2 en memoria,
      # por lo que no se conectan a ninguna base de datos real.
      - name: Build and test (backend)
        working-directory: marketplace-backend
        env:
          # Vector de prueba publico del RFC 6238 (no es un secreto real), lo usa ReglasNegocioTest
          TOTP_TEST_SECRET: GEZDGNBVGY3TQOJQGEZDGNBVGY3TQOJQ
        run: mvn -B verify

      - name: Cache SonarQube packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=estallados
            -Dsonar.projectKey=Estallados_SoftwareFake
            -Dsonar.sources=.
            -Dsonar.exclusions=**/src/test/**,**/*.spec.ts
            -Dsonar.tests=marketplace-backend/src/test,marketplace-frontend/src
            -Dsonar.test.inclusions=marketplace-backend/src/test/**,**/*.spec.ts
            -Dsonar.java.source=17
            -Dsonar.java.binaries=marketplace-backend/target/classes
            -Dsonar.java.test.binaries=marketplace-backend/target/test-classes
            -Dsonar.coverage.jacoco.xmlReportPaths=marketplace-backend/target/site/jacoco/jacoco.xml
