<header class="border-b border-slate-200/80 bg-white/95 backdrop-blur">
  <div class="mx-auto flex h-20 max-w-[1440px] items-center gap-8 px-8">
    <!-- Logo -->
    <a [routerLink]="homePath()" class="block shrink-0">
      <div class="flex items-center gap-3">
        <div class="grid size-10 place-items-center rounded-xl bg-emerald-700 text-white shadow-sm">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="m3 11 9-8 9 8" />
            <path d="M5 10v11h14V10M9 21v-7h6v7" />
          </svg>
        </div>
        <div class="text-left">
          <div class="font-display text-lg font-bold leading-none text-slate-900">INVERSIONES</div>
          <div class="mt-1 text-[10px] font-bold tracking-[0.35em] text-emerald-700">LR</div>
        </div>
      </div>
    </a>

    <!-- Opciones según el rol -->
    <nav class="hidden h-full shrink-0 items-center gap-1 lg:flex">
      @for (item of items(); track item[1]) {
        <a
          [routerLink]="item[1]"
          routerLinkActive
          #rla="routerLinkActive"
          class="relative flex h-full items-center whitespace-nowrap px-4 text-sm font-semibold transition"
          [class]="rla.isActive ? activeClass : inactiveClass"
        >
          {{ item[0] }}
        </a>
      }
    </nav>

    <div class="ml-auto flex items-center gap-2">
      @if (role() === 'Huésped') {
        <button
          type="button"
          (click)="auth('register')"
          class="hidden whitespace-nowrap px-3 text-sm font-bold text-emerald-700 xl:block"
        >
          Crear cuenta
        </button>
        <a
          [routerLink]="roleHome['Anfitrión']"
          class="hidden items-center justify-center gap-2 whitespace-nowrap rounded-xl px-5 py-3 text-sm font-bold text-slate-600 transition-all hover:bg-slate-100 lg:flex"
        >
          Publicar alojamiento
        </a>
      }

      <!-- Notificaciones (el admin no tiene ruta) -->
      @if (notificationsPath(); as notifPath) {
        <a
          [routerLink]="notifPath"
          aria-label="Notificaciones"
          class="relative grid size-11 place-items-center rounded-full text-slate-600 transition hover:bg-slate-100"
        >
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4" />
          </svg>
          @if (unread() > 0) {
            <span class="absolute right-1.5 top-1.5 grid size-5 place-items-center rounded-full bg-emerald-700 text-[10px] font-bold text-white">
              {{ unread() }}
            </span>
          }
        </a>
      }

      <!-- Menú de usuario / selector de rol -->
      <div class="relative">
        <button
          type="button"
          (click)="roleMenu = !roleMenu"
          class="flex items-center gap-3 rounded-full border border-slate-200 py-1.5 pl-1.5 pr-3 transition hover:shadow-md"
        >
          <span class="grid size-9 place-items-center rounded-full bg-emerald-100 text-sm font-bold text-emerald-800">
            {{ user().initials }}
          </span>
          <span class="hidden text-left md:block">
            <span class="block text-xs font-bold text-slate-800">{{ user().name }}</span>
            <span class="block text-[10px] text-slate-500">{{ role() }}</span>
          </span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M4 7h16M4 12h16M4 17h16" />
          </svg>
        </button>

        @if (roleMenu) {
          <div class="absolute right-0 top-14 w-64 rounded-2xl border border-slate-200 bg-white p-2 shadow-2xl">
            <p class="px-3 pb-2 pt-2 text-[10px] font-bold uppercase tracking-widest text-slate-400">
              Cambiar vista de demostración
            </p>

            @for (r of roles; track r) {
              <button type="button" [class]="roleItemClass(r)" (click)="pickRole(r)">
                <span class="flex items-center gap-3">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    @switch (roleIcon(r)) {
                      @case ('shield') {
                        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10Z" />
                      }
                      @case ('building') {
                        <rect x="4" y="3" width="16" height="18" rx="2" />
                        <path d="M9 7h.01M15 7h.01M9 11h.01M15 11h.01M9 15h.01M15 15h.01M9 21v-3h6v3" />
                      }
                      @case ('users') {
                        <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" />
                        <circle cx="9" cy="7" r="4" />
                        <path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75" />
                      }
                    }
                  </svg>
                  {{ r }}
                </span>
                @if (role() === r) {
                  <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="m5 12 4 4L19 6" />
                  </svg>
                }
              </button>
            }

            <div class="my-2 border-t border-slate-100"></div>

            <a routerLink="/perfil" (click)="closeMenu()" class="block w-full rounded-xl px-3 py-3 text-left text-sm font-semibold hover:bg-slate-50">
              Mi perfil
            </a>
            <button type="button" (click)="auth('login')" class="w-full rounded-xl px-3 py-3 text-left text-sm font-semibold hover:bg-slate-50">
              Cerrar sesión / Ingresar
            </button>
            <button type="button" (click)="auth('register')" class="w-full rounded-xl px-3 py-3 text-left text-sm font-semibold text-emerald-700 hover:bg-emerald-50">
              Crear una cuenta
            </button>
          </div>
        }
      </div>
    </div>
  </div>
</header>
