<div class="grid min-h-[calc(100vh-80px)] grid-cols-[245px_1fr]">
  <!-- ============ MENÚ LATERAL ============ -->
  <aside class="border-r border-slate-200 bg-white p-5">
    <p class="px-3 py-3 text-[10px] font-bold uppercase tracking-[0.22em] text-slate-400">
      {{ heading() }}
    </p>

    <nav class="mt-3 space-y-1">
      @for (item of items(); track item.label) {
        <a
          [routerLink]="item.path"
          routerLinkActive
          #rla="routerLinkActive"
          class="flex w-full items-center gap-3 rounded-xl px-4 py-3 text-sm font-semibold transition"
          [class]="rla.isActive ? activeClass : inactiveClass"
        >
          <svg
            width="19"
            height="19"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            @switch (item.icon) {
              @case ('chart') {
                <path d="M3 3v18h18" />
                <path d="m7 16 4-5 4 3 5-7" />
              }
              @case ('building') {
                <rect x="4" y="3" width="16" height="18" rx="2" />
                <path d="M9 7h.01M15 7h.01M9 11h.01M15 11h.01M9 15h.01M15 15h.01M9 21v-3h6v3" />
              }
              @case ('calendar') {
                <rect x="3" y="5" width="18" height="16" rx="2" />
                <path d="M16 3v4M8 3v4M3 10h18" />
              }
              @case ('users') {
                <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" />
                <circle cx="9" cy="7" r="4" />
                <path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75" />
              }
              @case ('bell') {
                <path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4" />
              }
              @case ('star') {
                <path d="m12 2 3 6 7 .9-5 4.8 1.4 6.8L12 17.3l-6.4 3.2L7 13.7 2 8.9 9 8Z" />
              }
              @case ('clipboard') {
                <rect x="5" y="4" width="14" height="17" rx="2" />
                <path d="M9 4V2h6v2M9 9h6M9 13h6M9 17h4" />
              }
              @case ('shield') {
                <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10Z" />
              }
            }
          </svg>
          {{ item.label }}
        </a>
      }
    </nav>

    <div class="mt-8 rounded-2xl bg-emerald-50 p-4">
      <p class="text-xs font-bold text-emerald-800">Centro de ayuda</p>
      <p class="mt-2 text-xs leading-5 text-emerald-700">
        Consulta la guía de uso de la plataforma.
      </p>
    </div>
  </aside>

  <!-- ============ CONTENIDO DE LA PÁGINA ============ -->
  <main class="min-w-0 bg-[#f6f8f6] p-10">
    <ng-content />
  </main>
</div>
