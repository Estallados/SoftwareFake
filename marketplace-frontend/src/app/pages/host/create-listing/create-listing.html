<div class="flex items-end justify-between">
  <div>
    <p class="text-xs font-bold uppercase tracking-[0.22em] text-emerald-700">Inversiones LR</p>
    <h1 class="font-display mt-2 text-3xl font-bold text-slate-900">Crear alojamiento</h1>
    <p class="mt-2 text-sm text-slate-500">Completa la información para publicar una nueva propiedad.</p>
  </div>
</div>

<form (ngSubmit)="submit()" class="mt-8 rounded-2xl border border-slate-200 bg-white p-8">
  <div class="grid grid-cols-2 gap-6">
    <label class="block">
      <span class="mb-2 block text-sm font-bold">Título del alojamiento <span class="text-red-500">*</span></span>
      <input name="name" required [(ngModel)]="draft.name" class="w-full rounded-xl border border-slate-200 p-4 text-sm outline-none focus:border-emerald-500" />
    </label>
    <label class="block">
      <span class="mb-2 block text-sm font-bold">Ciudad <span class="text-red-500">*</span></span>
      <input name="city" required [(ngModel)]="draft.city" class="w-full rounded-xl border border-slate-200 p-4 text-sm outline-none focus:border-emerald-500" />
    </label>
    <label class="col-span-2 block">
      <span class="mb-2 block text-sm font-bold">Descripción <span class="text-red-500">*</span></span>
      <textarea name="description" required rows="4" [(ngModel)]="draft.description" class="w-full rounded-xl border border-slate-200 p-4 text-sm outline-none focus:border-emerald-500"></textarea>
    </label>
    <label class="block">
      <span class="mb-2 block text-sm font-bold">Ubicación <span class="text-red-500">*</span></span>
      <input name="location" required [(ngModel)]="draft.location" class="w-full rounded-xl border border-slate-200 p-4 text-sm outline-none focus:border-emerald-500" />
    </label>
    <label class="block">
      <span class="mb-2 block text-sm font-bold">Tipo de alojamiento <span class="text-red-500">*</span></span>
      <input name="type" required [(ngModel)]="draft.type" class="w-full rounded-xl border border-slate-200 p-4 text-sm outline-none focus:border-emerald-500" />
    </label>
    <label class="block">
      <span class="mb-2 block text-sm font-bold">Capacidad <span class="text-red-500">*</span></span>
      <input name="capacity" required placeholder="6 huéspedes" [(ngModel)]="draft.capacity" class="w-full rounded-xl border border-slate-200 p-4 text-sm outline-none focus:border-emerald-500 focus:ring-2 focus:ring-emerald-100" />
    </label>
    <label class="block">
      <span class="mb-2 block text-sm font-bold">Habitaciones <span class="text-red-500">*</span></span>
      <input name="rooms" required placeholder="3" [(ngModel)]="draft.rooms" class="w-full rounded-xl border border-slate-200 p-4 text-sm outline-none focus:border-emerald-500 focus:ring-2 focus:ring-emerald-100" />
    </label>
    <label class="block">
      <span class="mb-2 block text-sm font-bold">Baños <span class="text-red-500">*</span></span>
      <input name="baths" required placeholder="2" [(ngModel)]="draft.baths" class="w-full rounded-xl border border-slate-200 p-4 text-sm outline-none focus:border-emerald-500 focus:ring-2 focus:ring-emerald-100" />
    </label>
    <label class="block">
      <span class="mb-2 block text-sm font-bold">Precio por noche <span class="text-red-500">*</span></span>
      <input name="price" required placeholder="$245.000" [(ngModel)]="draft.price" class="w-full rounded-xl border border-slate-200 p-4 text-sm outline-none focus:border-emerald-500" />
    </label>
  </div>

  <div class="mt-8">
    <h3 class="font-bold">Servicios incluidos</h3>
    <div class="mt-4 flex flex-wrap gap-3">
      @for (s of services; track s) {
        <label class="rounded-xl border border-slate-200 px-4 py-3 text-sm">
          <input
            type="checkbox"
            [checked]="draft.amenities.includes(s)"
            (change)="toggleService(s)"
            class="mr-2 accent-emerald-700"
          />
          {{ s }}
        </label>
      }
    </div>
  </div>

  <div class="mt-8 rounded-2xl border-2 border-dashed border-slate-200 p-10 text-center">
    <svg class="mx-auto" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M12 5v14M5 12h14" />
    </svg>
    <p class="mt-2 font-bold">Agrega fotografías del alojamiento</p>
    <p class="text-sm text-slate-500">Carga simulada para este prototipo</p>
  </div>

  <div class="mt-8 flex justify-end gap-3">
    <button
      type="button"
      (click)="saveDraft()"
      class="inline-flex items-center justify-center gap-2 rounded-xl border border-slate-200 bg-white px-5 py-3 text-sm font-bold text-slate-800 transition-all hover:border-emerald-300 hover:bg-emerald-50"
    >
      Guardar borrador
    </button>
    <button
      type="submit"
      class="inline-flex items-center justify-center gap-2 rounded-xl bg-emerald-700 px-5 py-3 text-sm font-bold text-white shadow-sm transition-all hover:bg-emerald-800"
    >
      Enviar a revisión
    </button>
  </div>
</form>
